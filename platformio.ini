; PlatformIO Project Configuration File
;
; ESP32HUD35 - ESP32-3248S035 (ESP32 Smart Display 3.5")
; Màn hình: 320x480 (ST7796 SPI), cảm ứng: GT911 (I2C)
;
; Cảm ứng điện dung GT911, kết nối OBD-II CAN 500k qua SN65HVD230.
; TWAI: TX=GPIO25, RX=GPIO14

[platformio]
default_envs = esp32-3248S035C

[env]
platform = espressif32
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

board_build.partitions = min_spiffs.csv

build_flags =
    -Ofast
    #-Wall
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_WARN
    # LVGL 9.5 dùng #include LV_CONF_PATH nen can ca dau nhay kep
    -D LV_CONF_PATH='"${platformio.include_dir}/lv_conf.h"'

# Library esp32-smartdisplay được vendored tại lib/esp32_smartdisplay
lib_deps =
    lvgl/lvgl@9.5.0

[env:esp32-3248S035C]
board = esp32-3248S035C