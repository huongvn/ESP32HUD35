; PlatformIO Project Configuration File
;
; ESP32HUD35 - ESP32-3248S035 (ESP32 Smart Display 3.5")
; Màn hình: 320x480 (ST7796 SPI), cảm ứng: GT911 (I2C) / XPT2046 (SPI)
;
; Bo mạch cảm ứng điện dung (GT911): env esp32-3248S035C (mặc định)
; Bo mạch cảm ứng điện trở (XPT2046): env esp32-3248S035R

[platformio]
default_envs = esp32-3248S035C

[env]
platform = espressif32
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

board_build.partitions = min_spiffs.csv

build_flags =
    -Ofast
    #-Wall
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
    # LVGL 9.5 dùng #include LV_CONF_PATH nen can ca dau nhay kep
    -D LV_CONF_PATH='"${platformio.include_dir}/lv_conf.h"'

# Library esp32-smartdisplay được vendored tại lib/esp32_smartdisplay
lib_deps =
    lvgl/lvgl@9.5.0

[env:esp32-3248S035C]
board = esp32-3248S035C

[env:esp32-3248S035R]
board = esp32-3248S035R

[env:tftetest]
board = esp32-3248S035C
build_flags =
    -D LV_CONF_PATH='"${platformio.include_dir}/lv_conf.h"'
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_MISO=12
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=1
    -D SPI_FREQUENCY=65000000
    -D SPI_READ_FREQUENCY=16000000
lib_deps =
    bodmer/TFT_eSPI@^2.5.43